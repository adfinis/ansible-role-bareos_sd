---

dependency:
  name: galaxy
  options:
    role-file: requirements.yml
    requirements-file: requirements.yml

lint: |
  set -e
  yamllint .
  ansible-lint

driver:
  name: docker

platforms:
  - name: "bareossd-${image:-debian13}${TOX_ENVNAME}"
    image: "geerlingguy/docker-${image:-debian13}-ansible:latest"
    command: "/sbin/init"
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    privileged: true
    cgroupns_mode: host
    pre_build_image: true

provisioner:
  name: ansible
  config_options:
    defaults:
      roles_path: "~/.ansible/roles:${MOLECULE_PROJECT_DIRECTORY}/.."

verifier:
  name: ansible
