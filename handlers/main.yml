---
# handlers file for bareos_sd

- name: Check configuration
  ansible.builtin.command: "/usr/sbin/bareos-sd --test-config"
  changed_when: false

- name: Restart bareos-sd
  ansible.builtin.service:
    name: bareos-sd
    state: restarted

- name: Restart VersityGw
  ansible.builtin.service:
    name: "versitygw@{{ item.service_name | default(item.name) }}"
    state: restarted
  loop: "{{ bareos_sd_s3_backends }}"
  when:
    - item.use_versitygw | default(false)
    - item.enabled | default(true)
